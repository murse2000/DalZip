name: DalZip 검증 및 릴리스
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-shell.ps1
      - run: npm run check
      - run: npm test
      - if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@v4
        with:
          name: DalZip-${{ runner.os }}
          if-no-files-found: error
          path: |
            artifacts/DalZip-*.dmg
            artifacts/DalZip-*.app.tar.gz*
            artifacts/DalZip-*.exe*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: DalZip-*
          merge-multiple: true
          path: artifacts
      - name: 버전 및 업데이트 피드 검증
        run: |
          node -e 'const v=JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json")).version; if (process.env.GITHUB_REF_NAME !== `v${v}`) process.exit(1)'
          node scripts/release-manifest.mjs
      - name: 모든 파일 업로드 후 릴리스 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --title "DalZip $GITHUB_REF_NAME" --notes-file "releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
